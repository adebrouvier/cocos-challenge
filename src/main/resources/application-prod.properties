# Must be a JDBC URL, e.g. jdbc:postgresql://host:5432/cocos
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# The production database already contains the challenge schema and data (migration V1). On the first
# start, Flyway records V1 as the baseline instead of running it, then applies the later migrations
# (baseline-on-migrate, see application.properties).

# Never allow Flyway to wipe production.
spring.flyway.clean-disabled=true
