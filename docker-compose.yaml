services:
  postgres:
    image: postgres:18.6
    container_name: cocos
    environment:
      POSTGRES_DB: cocos
      POSTGRES_USER: ariel
      POSTGRES_PASSWORD: db_password
      TZ: America/Argentina/Buenos_Aires
    command: ["postgres", "-c", "timezone=America/Argentina/Buenos_Aires"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/

volumes:
  postgres_data: