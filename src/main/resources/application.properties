spring.application.name=cocos
# Without SPRING_PROFILES_ACTIVE, run against the local docker-compose database (application-dev.properties).
spring.profiles.default=dev
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
# Reject decimals for integer fields (e.g. "size": 1.5) instead of silently dropping the fraction.
spring.jackson.deserialization.accept-float-as-int=false

# Use a session-level advisory lock instead of an open transaction while migrating; required for
# the CREATE INDEX CONCURRENTLY migration.
spring.flyway.postgresql.transactional-lock=false

# If the challenge schema was loaded by hand (tables exist, no Flyway history table), record V1 as already
# applied instead of running it, then apply the later migrations. An empty database runs V1 as usual.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Pre-existing challenge schema and data
